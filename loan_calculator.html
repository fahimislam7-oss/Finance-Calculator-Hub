<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator - Finance Calculator Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>Loan EMI Calculator</h1>
            <p>Calculate your monthly loan payments and total interest.</p>
        </div>
    </header>

    <main class="container">
        <div class="calc-card">
            <div class="form-group">
                <label for="loanAmount">Loan Amount (₹):</label>
                <input type="number" id="loanAmount" placeholder="e.g. 500000">
            </div>
            <div class="form-group">
                <label for="interestRate">Annual Interest Rate (%):</label>
                <input type="number" id="interestRate" placeholder="e.g. 8.5" step="0.1">
            </div>
            <div class="form-group">
                <label for="tenure">Loan Tenure (Years):</label>
                <input type="number" id="tenure" placeholder="e.g. 5">
            </div>
            <button class="calc-btn" onclick="calculateEMI()">Calculate EMI</button>
            
            <div class="result-box" id="emiResult" style="display: none;">
                <h4>Calculation Result:</h4>
                <p id="emiOutput"></p>
            </div>
            
            <a href="index.html" class="back-btn">&larr; Back to Home</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Finance Calculator Hub</p>
    </footer>

    <script>
        function calculateEMI() {
            let p = parseFloat(document.getElementById('loanAmount').value);
            let annualRate = parseFloat(document.getElementById('interestRate').value);
            let years = parseFloat(document.getElementById('tenure').value);

            if(isNaN(p) || isNaN(annualRate) || isNaN(years)) {
                alert("Please fill in all fields correctly.");
                return;
            }

            let r = annualRate / 12 / 100;
            let n = years * 12;
            let emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            let totalPayment = emi * n;
            let totalInterest = totalPayment - p;

            document.getElementById('emiOutput').innerHTML = 
                `Monthly EMI: <strong>₹ ${emi.toFixed(2)}</strong><br>` +
                `Total Interest: <strong>₹ ${totalInterest.toFixed(2)}</strong><br>` +
                `Total Payment: <strong>₹ ${totalPayment.toFixed(2)}</strong>`;
            document.getElementById('emiResult').style.display = 'block';
        }
    </script>
</body>
</html>
