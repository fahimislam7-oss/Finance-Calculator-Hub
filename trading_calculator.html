<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading P&L Calculator - Finance Calculator Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>Trading Profit & Loss Calculator</h1>
            <p>Calculate your stock or options trade P&L and return percentage.</p>
        </div>
    </header>

    <main class="container">
        <div class="calc-card">
            <div class="form-group">
                <label for="buyPrice">Buy Price per Share (₹):</label>
                <input type="number" id="buyPrice" placeholder="e.g. 150" step="0.05">
            </div>
            <div class="form-group">
                <label for="sellPrice">Sell Price per Share (₹):</label>
                <input type="number" id="sellPrice" placeholder="e.g. 175" step="0.05">
            </div>
            <div class="form-group">
                <label for="quantity">Quantity (Shares):</label>
                <input type="number" id="quantity" placeholder="e.g. 100">
            </div>
            <button class="calc-btn" onclick="calculatePL()">Calculate P&L</button>
            
            <div class="result-box" id="plResult" style="display: none;">
                <h4>Calculation Result:</h4>
                <p id="plOutput"></p>
            </div>
            
            <a href="index.html" class="back-btn">&larr; Back to Home</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Finance Calculator Hub</p>
    </footer>

    <script>
        function calculatePL() {
            let buy = parseFloat(document.getElementById('buyPrice').value);
            let sell = parseFloat(document.getElementById('sellPrice').value);
            let qty = parseFloat(document.getElementById('quantity').value);

            if(isNaN(buy) || isNaN(sell) || isNaN(qty)) {
                alert("Please fill in all fields correctly.");
                return;
            }

            let investment = buy * qty;
            let totalSell = sell * qty;
            let netPL = totalSell - investment;
            let percentage = (netPL / investment) * 100;
            let status = netPL >= 0 ? "Profit 🟢" : "Loss 🔴";

            document.getElementById('plOutput').innerHTML = 
                `Status: <strong>${status}</strong><br>` +
                `Net Profit/Loss: <strong>₹ ${netPL.toFixed(2)}</strong><br>` +
                `Return Percentage: <strong>${percentage.toFixed(2)}%</strong>`;
            document.getElementById('plResult').style.display = 'block';
        }
    </script>
</body>
</html>
