<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age & Date Calculator - Finance Calculator Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>Age & Date Calculator</h1>
            <p>Find your exact age in years, months, and days.</p>
        </div>
    </header>

    <main class="container">
        <div class="calc-card">
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob">
            </div>
            <div class="form-group">
                <label for="targetDate">Target Date (Optional, defaults to today):</label>
                <input type="date" id="targetDate">
            </div>
            <button class="calc-btn" onclick="calculateAge()">Calculate Age</button>
            
            <div class="result-box" id="ageResult" style="display: none;">
                <h4>Calculation Result:</h4>
                <p id="ageOutput"></p>
            </div>
            
            <a href="index.html" class="back-btn">&larr; Back to Home</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Finance Calculator Hub</p>
    </footer>

    <script>
        function calculateAge() {
            let dobVal = document.getElementById('dob').value;
            let targetVal = document.getElementById('targetDate').value;

            if(!dobVal) {
                alert("Please select your Date of Birth.");
                return;
            }

            let birthDate = new Date(dobVal);
            let targetDate = targetVal ? new Date(targetVal) : new Date();

            if(birthDate > targetDate) {
                alert("Date of Birth cannot be after the target date.");
                return;
            }

            let years = targetDate.getFullYear() - birthDate.getFullYear();
            let months = targetDate.getMonth() - birthDate.getMonth();
            let days = targetDate.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                let prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('ageOutput').innerHTML = 
                `Exact Age: <strong>${years} Years, ${months} Months, and ${days} Days</strong>`;
            document.getElementById('ageResult').style.display = 'block';
        }
    </script>
</body>
</html>
